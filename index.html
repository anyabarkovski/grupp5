<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webbutik – Startsida</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="site-header">
    <a class="logo" href="index.html">Webbutik</a>
    <nav aria-label="Huvudmeny">
      <ul>
        <li><a href="index.html" aria-current="page">Hem</a></li>
        <li><a href="#katalog">Katalog</a></li>
        <li><a href="favoriter.html">Favoriter</a></li>
        <li><a href="varukorg.html">Varukorg</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Hitta dina nya favoriter</h1>
      <p>Upptäck vårt sortiment och hitta produkter som passar dig.</p>
      <a class="button" href="#katalog">Köp</a>
    </section>

    <section id="katalog" class="catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title">Vår katalog</h2>

        <div class="catalog-controls">
            <label for="search-input">Sök produkter</label>
            <input type="search" id="search-input" placeholder="Sök efter en produkt">

            <label for="category-filter">Filtrera efter kategori</label>
            <select id="category-filter">
                <option value="all">Alla kategorier</option>
                <option value="beauty">Skönhet</option>
                <option value="fragrances">Parfymer</option>
                <option value="furniture">Möbler</option>
                <option value="groceries">Matvaror</option>
            </select>

            <label for="sort-select">Sortera</label>
            <select id="sort-select">
                <option value="default">Standard</option>
                <option value="price-asc">Pris: lägst först</option>
                <option value="price-desc">Pris: högst först</option>
            </select>
        </div>

        <!-- JavaScript hämtar produkter från https://dummyjson.com/products och visar produktkorten här. -->
        <div class="container" aria-live="polite"></div>
        <div class="form-to-edit"></div>
        <p class="message"></p>
    </section>

    <section id="add-product" class="add-product" aria-labelledby="add-product-title">
        <h2 id="add-product-title">Lägg till en produkt</h2>
        <form id="product-form">
            <div>
            <label for="product-title">Produktnamn</label>
            <input type="text" id="product-title" name="title" required>
            </div>
            <div>
            <label for="product-image">Länk till bild</label>
            <input type="file" name="images" id="image" accept="image/*" required>
            </div>
            <div>
            <label for="product-description">Beskrivning</label>
            <textarea id="product-description" name="description" rows="3"></textarea>
            </div>
            <div>
            <label for="product-price">Pris</label>
            <input type="number" id="product-price" name="price" min="0" step="0.01" required>
            </div>
            <div>
            <label for="product-rating">Rating</label>
            <input type="number" id="product-rating" name="rating" min="0" step="0.01" required>
            </div>
            <div>
            <label for="product-category">Kategori</label>
            <select id="product-category" name="category" required>
                <option value="">Välj kategori</option>
                <option value="beauty">Skönhet</option>
                <option value="fragrances">Parfymer</option>
                <option value="furniture">Möbler</option>
                <option value="groceries">Matvaror</option>
            </select>
            </div>
            <button class="btn-form" type="submit">Lägg till produkt</button>
        </form>
    </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Webbutik.</p>
    </footer>
</body>
</html>
