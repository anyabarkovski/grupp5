<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betalning – Webbutik</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Webbutik</a>
    <nav aria-label="Huvudmeny">
      <ul>
        <li><a href="index.html">Hem</a></li>
        <li><a href="favoriter.html">Favoriter</a></li>
        <li><a href="varukorg.html">Varukorg</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="checkout-title">
      <h1 id="checkout-title">Betalning</h1>
      <div id="checkout-summary" aria-live="polite">
        <!-- JavaScript kan visa orderöversikt från varukorgen här. -->
      </div>

      <form id="checkout-form">
        <fieldset>
          <legend>Kontaktuppgifter</legend>
          <label for="full-name">För- och efternamn</label>
          <input type="text" id="full-name" name="fullName" autocomplete="name" required>
          <label for="email">E-postadress</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <label for="phone">Telefonnummer</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel">
        </fieldset>

        <fieldset>
          <legend>Leveransadress</legend>
          <label for="street">Gatuadress</label>
          <input type="text" id="street" name="street" autocomplete="street-address" required>
          <label for="postal-code">Postnummer</label>
          <input type="text" id="postal-code" name="postalCode" autocomplete="postal-code" required>
          <label for="city">Ort</label>
          <input type="text" id="city" name="city" autocomplete="address-level2" required>
        </fieldset>

        <fieldset>
          <legend>Betalningsmetod (demoval)</legend>
          <label><input type="radio" name="paymentMethod" value="card" required> Kort</label>
          <label><input type="radio" name="paymentMethod" value="invoice"> Faktura</label>
          <label><input type="radio" name="paymentMethod" value="swish"> Swish</label>
        </fieldset>

        <p class="form-note">Detta är ett skolprojekt. Inga riktiga betalningar genomförs.</p>
        <button type="submit">Bekräfta beställning</button>
      </form>
      <a class="button button-secondary" href="varukorg.html">Gå tillbaka</a>
    </section>
  </main>

  <footer class="site-footer"><p>&copy; 2026 Webbutik.</p></footer>
</body>
</html>
